<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>シフト確定確認</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>シフト確定確認</h1>

    <p>必要に応じて内容を修正してから、シフトを確定してください。</p>

    <form action="/confirm_shift/{{ shift.id }}" method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div class="shift-card">

            <p>
                <strong>ユーザー名：</strong>
                {{ shift.username }}
            </p>

            <div class="form-group">
                <label>日付</label>
                <input
                    type="date"
                    name="date"
                    value="{{ shift.date }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>開始時間</label>
                <input
                    type="time"
                    name="time"
                    value="{{ shift.time }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>終了時間</label>
                <input
                    type="time"
                    name="end_time"
                    value="{{ shift.end_time }}"
                    required
                >
            </div>

        </div>

        <button type="submit">
            この内容でシフトを確定する
        </button>

    </form>

    <br>

    <a href="/admin" class="menu-link">
        管理者ページに戻る
    </a>

</div>

</body>
</html>
