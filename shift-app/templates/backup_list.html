<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>バックアップ一覧</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>バックアップ一覧</h1>

    {% if files %}

    <table>

        <tr>
            <th>バックアップファイル</th>
            <th>復元</th>
            <th>削除</th>
        </tr>

        {% for file in files %}

        <tr>

            <td>{{ file }}</td>

            <td>
                <a
                    class="menu-link"
                    href="/restore_confirm/{{ file }}"
                >
                    復元
                </a>
            </td>

            <td>

                <form
                    action="/delete_backup/{{ file }}"
                    method="POST"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <button
                        class="delete-button"
                        type="submit"
                    >
                        削除
                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}

    </table>

    {% else %}

        <p>バックアップはありません。</p>

    {% endif %}

    <br>

    <a href="/admin" class="menu-link">
        管理者ページへ戻る
    </a>

</div>

</body>
</html>
