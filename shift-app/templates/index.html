<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>シフト入力フォーム</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>シフト入力フォーム</h1>

<p>こんにちは、{{ username }}さん</p>

{% if is_admin_user %}
    <p>
        <a href="/admin">管理者ページ</a>
    </p>

    <p>
        <a href="/confirmed_shifts">確定シフト一覧</a>
    </p>
{% endif %}

<p>
    <a href="/my_confirmed_shifts">自分の確定シフトを見る</a>
</p>

<!-- ログアウトボタン -->
<form action="/logout">
    <button type="submit">ログアウト</button>
</form>

<form method="POST" id="shift-form">

    

        <div class="form-row">

            <div class="form-group">
                <label>名前</label>
                <input type="text" name="name" id="name-input">
            </div>

            <div class="form-group">
                <label>日付</label>
                <input type="date" name="date" id="date-input">
            </div>

            <div class="form-group">
                <label>時間</label>
                <input type="time" name="time" id="time-input">
                <label>終了時間</label>
                <input type="time" name="end_time" required>
            </div>

        </div>

        <p id="error-message"></p>

        <button type="submit">送信</button>

    </form>

    {% for shift in shifts %}

    <div class="shift-card">

        <p>名前：{{ shift.name }}</p>
        <p>日付：{{ shift.date }}</p>
        <p>時間：{{ shift.time }} ～ {{ shift.end_time }}</p>

        <a href="/edit/{{ shift.id }}">
    編集
</a>

<form action="/delete/{{ shift.id }}" method="POST" class="delete-form">

    <button class="delete-button" type="submit">
        削除
    </button>

</form>

    </div>

    {% endfor %}

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
