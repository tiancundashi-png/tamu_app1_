<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>自分の確定シフト</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>自分の確定シフト</h1>

    {% if shifts %}

        {% for shift in shifts %}

            <div class="shift-card">

                <p>日付：{{ shift.date }}</p>

                <p>
                    時間：{{ shift.time }}
                    ～ {{ shift.end_time }}
                </p>

            </div>

        {% endfor %}

    {% else %}

        <p>確定しているシフトはありません。</p>

    {% endif %}

    <br>

    <a href="/" class="menu-link">
        トップページに戻る
    </a>

</div>

</body>

</html>
