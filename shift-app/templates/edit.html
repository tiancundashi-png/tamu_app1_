<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>シフト編集</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>シフト編集</h1>

    <form action="/update/{{ shift.id }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label>名前</label>
            <input
                type="text"
                name="name"
                value="{{ shift.name }}"
                required
            >
        </div>

        <div class="form-group">
            <label>日付</label>
            <input
                type="date"
                name="date"
                value="{{ shift.date }}"
                required
            >
        </div>

        <div class="form-group">
            <label>開始時間</label>
            <input
                type="time"
                name="time"
                value="{{ shift.time }}"
                required
            >
        </div>

        <div class="form-group">
            <label>終了時間</label>
            <input
                type="time"
                name="end_time"
                value="{{ shift.end_time }}"
                required
            >
        </div>

        <button type="submit">
            シフトを更新する
        </button>

    </form>

    <br>

    <a href="/" class="menu-link">
        トップページに戻る
    </a>

</div>

</body>
</html>
