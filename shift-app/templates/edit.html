<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>シフト編集</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>シフト編集</h1>

<form action="/update/{{ shift.id }}" method="POST">

    <div class="form-group">
        <label>名前</label>
        <input
            type="text"
            name="name"
            value="{{ shift.name }}"
        >
    </div>

    <div class="form-group">
        <label>日付</label>
        <input
            type="date"
            name="date"
            value="{{ shift.date }}"
        >
    </div>

    <div class="form-group">
        <label>時間</label>
        <input
            type="time"
            name="time"
            value="{{ shift.time }}"
        >
    </div>

    <button type="submit">
        更新
    </button>

</form>

<a href="/">戻る</a>
</div>
</body>
</html>
