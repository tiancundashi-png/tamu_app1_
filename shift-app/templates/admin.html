<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理者ページ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>管理者ページ</h1>

        <h2>管理者メニュー</h2>

        <p>
            <a class="menu-link" href="/register">スタッフ登録</a>
            <a class="menu-link" href="/users">従業員一覧</a>
            <a class="menu-link" href="/confirmed_shifts">確定済みシフト一覧</a>
            <a class="menu-link" href="/backup">バックアップ作成</a>
            <a class="menu-link" href="/backup_list">バックアップ一覧</a>
            <a class="menu-link" href="/">トップページに戻る</a>
        </p>

        <hr>

        <h2>全従業員のシフト希望</h2>

        <form method="GET" action="/admin">
            <label>日付で絞り込み</label>

            <input
                type="date"
                name="date"
                value="{{ selected_date }}"
            >

            <button type="submit">検索</button>
        </form>

        <hr>

        {% if shifts %}

            {% for shift in shifts %}

                <div class="shift-card">
                    <p>ユーザー名：{{ shift.username }}</p>
                    <p>日付：{{ shift.date }}</p>
                    <p>時間：{{ shift.time }} ～ {{ shift.end_time }}</p>

                    <p>
                        <a class="menu-link" href="/confirm_shift/{{ shift.id }}">
                            このシフトを確定する
                        </a>
                    </p>
                </div>

            {% endfor %}

        {% else %}

            <p>表示できるシフト希望はありません。</p>

        {% endif %}

    </div>

</body>
</html>
