<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>従業員削除確認</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>従業員削除確認</h1>

    <div class="shift-card">
        <p><strong>本当にこの従業員を削除しますか？</strong></p>

        <p>ユーザー名：{{ user.username }}</p>
        <p>権限：{{ user.role }}</p>

        <p id="error-message">
            この従業員の未確定シフト・確定済みシフトも削除されます。
        </p>
    </div>

    <form action="/delete_user/{{ user.id }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <button class="delete-button" type="submit">
            削除する
        </button>
    </form>

    <br>

    <a href="/users" class="menu-link">
        キャンセル
    </a>

</div>

</body>
</html>
