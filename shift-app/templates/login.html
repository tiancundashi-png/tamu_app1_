<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ログイン</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>ログイン</h1>

    {% if error %}
        <p id="error-message">
            {{ error }}
        </p>
    {% endif %}

    <form action="/login" method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="form-group">
            <label>ユーザー名</label>

            <input
                type="text"
                name="username"
                required
            >
        </div>

        <div class="form-group">
            <label>パスワード</label>

            <input
                type="password"
                name="password"
                required
            >
        </div>

        <button type="submit">
            ログイン
        </button>

    </form>

</div>

</body>
</html>
