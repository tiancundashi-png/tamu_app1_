<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>復元確認</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>バックアップ復元確認</h1>

    <div class="shift-card">

        <p>
            <strong>本当に復元しますか？</strong>
        </p>

        <p id="error-message">
            復元すると現在のデータは上書きされます。
        </p>

        <p>
            対象ファイル：
        </p>

        <p>
            {{ filename }}
        </p>

    </div>

    <form
        method="POST"
        action="/restore_backup/{{ filename }}"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <button type="submit">
            復元する
        </button>

    </form>

    <br>

    <a
        href="/backup_list"
        class="menu-link"
    >
        キャンセル
    </a>

</div>

</body>
</html>
